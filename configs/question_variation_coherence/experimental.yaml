# Experimental Configuration for Question-Variation Coherence
# Uses more variations and wider temperature range for enhanced signal
# Use when: Maximizing coherence signal quality for research

evaluation:
  # Model configuration
  model: gpt-4o-mini  # Cost-effective model for evaluation

  # Coherence parameters
  coherence_variant: olsson  # Try different variant
  coherence_threshold: 0.5   # Balanced threshold

  # Question variation parameters (ENHANCED)
  num_variations: 10         # More variations for better signal
  temperature_range: [0.5, 0.7, 1.0, 1.3, 1.6]  # Wider diversity range

  # Answer strategy
  abstention_response: "I don't know"
  high_coherence_answer_yes: true  # YES/NO polarity (tune empirically)

  # Sample and output
  sample_size: 100  # Small sample for experimentation
  output_dir: results/experimental

  # Infrastructure
  checkpoint_interval: 25  # More frequent checkpoints
  workers: 4              # Parallel API calls
  run_baseline: true      # Compare to baseline
  verbose: true           # Enable verbose logging

# Expected results:
# - Higher quality coherence signal due to more variations
# - Better differentiation between high/low coherence questions
# - ~2x API cost vs standard config due to 10 variations

# Cost estimate (sample_size=100, gpt-4o-mini):
# - API calls: ~2,600 (vs ~1,800 with 5 variations)
# - Estimated cost: $0.30-0.40 USD
# - Use for validation before full dataset run

# To run:
# cosmos-coherence simpleqa run-with-coherence --config configs/question_variation_coherence/experimental.yaml
